name: Release

# Pushing a tag like v0.2.0 tests, builds a universal DMG and the prinbox command's tarball with version
# 0.2.0 and publishes a GitHub Release with both and their SHA-256 files. Builds are ad hoc signed;
# RELEASING.md explains how to switch to Developer ID signing and notarization.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: make test
      - name: Release notes
        run: mkdir -p build && scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > build/release-notes.md
      - name: Build DMG
        run: make dmg VERSION="${GITHUB_REF_NAME#v}"
      - name: Build the command tarball
        run: make cli-tarball VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/PRInbox-$version.dmg" "build/PRInbox-$version.dmg.sha256" \
            "build/prinbox-$version-macos.tar.gz" "build/prinbox-$version-macos.tar.gz.sha256" \
            --title "PRInbox $version" --notes-file build/release-notes.md --generate-notes

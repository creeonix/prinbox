name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Lint
        run: make lint
      - name: Release notes for the Makefile version
        run: scripts/release-notes.sh
      - name: Tap templates render
        run: |
          dir=$(mktemp -d)
          printf '%064d  PRInbox-0.0.0.dmg\n' 1 > "$dir/PRInbox-0.0.0.dmg.sha256"
          printf '%064d  prinbox-0.0.0-macos.tar.gz\n' 2 > "$dir/prinbox-0.0.0-macos.tar.gz.sha256"
          out=$(scripts/update-tap.sh 0.0.0 --from-dir "$dir" --dry-run)
          grep -q 'version "0.0.0"' <<<"$out"
          if grep -q '@[A-Z0-9_]*@' <<<"$out"; then echo "placeholder left in the rendered tap files" >&2; exit 1; fi
      - name: Test with coverage
        run: make coverage
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: jq for the anonymizer tests
        run: apt-get update -qq && apt-get install -y -qq jq
      - name: Build
        run: swift build
      - name: Test
        run: swift test
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neovim, Emacs, tmux and fzf
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz | tar -xz -C "$HOME"
          echo "$HOME/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq emacs-nox tmux fzf
      - name: Versions
        run: nvim --version | head -1 && emacs --version | head -1 && tmux -V && fzf --version
      - name: Adapter suites
        run: make test-adapters
